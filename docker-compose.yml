version: '3.8'

services:
  google-plugin-store:
    image: youpingfang/google-plugin-store:1.5.19
    ports:
      - "3005:3000"
    volumes:
      - /root/dockerdata/google-plugin-store/data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: unless-stopped